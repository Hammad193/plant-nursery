<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Haven Admin Dashboard</title><link rel="stylesheet" href="admin.css"></head><body data-auth-required="true"><aside class="sidebar"><div class="brand">Green Haven Nursery<small>Admin Panel</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="product-form.html">Add Product</a><a href="orders.html">Orders</a></nav><button class="btn btn-danger" style="margin:24px 12px 0" onclick="ghLogout()">Logout</button></aside><main class="main">
<div class="topbar"><h1>Dashboard</h1><a class="btn btn-primary" href="product-form.html">+ Add Product</a></div>
<div class="stats"><div class="card"><span class="muted">Products</span><strong id="productCount">0</strong></div><div class="card"><span class="muted">In Stock</span><strong id="stockCount">0</strong></div><div class="card"><span class="muted">Orders</span><strong id="orderCount">0</strong></div><div class="card"><span class="muted">New Orders</span><strong id="newCount">0</strong></div></div>
<div class="card"><h2>Recent Orders</h2><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody id="recentOrders"></tbody></table></div></div>
</main><script src="seed.js"></script><script src="admin.js"></script><script>
const productCount = document.getElementById("productCount");
const stockCount = document.getElementById("stockCount");
const orderCount = document.getElementById("orderCount");
const newCount = document.getElementById("newCount");
const recentOrders = document.getElementById("recentOrders");

function renderDashboard() {
    const products = ghProducts();
    const orders = ghOrders();

    productCount.textContent = products.length;
    stockCount.textContent = products.filter(product => Number(product.stock) > 0).length;
    orderCount.textContent = orders.length;
    newCount.textContent = orders.filter(order => (order.status || "New") === "New").length;

    recentOrders.innerHTML = orders.slice().reverse().slice(0, 8).map(order => `
        <tr>
            <td>${ghEsc(order.orderNumber)}</td>
            <td>${ghEsc(order.customer?.name)}</td>
            <td>${ghMoney(order.total)}</td>
            <td><span class="badge status">${ghEsc(order.status || "New")}</span></td>
            <td><a class="btn btn-secondary" href="order-details.html?id=${encodeURIComponent(order.orderNumber)}">View</a></td>
        </tr>`).join("") || '<tr><td colspan="5" class="muted">No orders yet.</td></tr>';
}

document.addEventListener("DOMContentLoaded", async () => {
    if (await ghAdminReady()) {
        renderDashboard();
    }
});
window.addEventListener("greenHavenProductsUpdated", renderDashboard);
window.addEventListener("greenHavenOrdersUpdated", renderDashboard);
</script></body></html>
