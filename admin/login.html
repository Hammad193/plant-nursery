<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Haven Admin Login</title><link rel="stylesheet" href="admin.css"></head><body class="login-page"><main class="login-card"><div class="brand" style="color:#173b27;padding:0 0 20px">Green Haven Nursery<small style="color:#718077">Admin Panel</small></div><h1>Admin Login</h1><p class="muted">Temporary local admin access until the backend is connected.</p><form id="loginForm"><div class="field"><label>Email</label><input class="input" id="email" type="email" required></div><div class="field"><label>Password</label><input class="input" id="password" type="password" required></div><div class="error" id="error"></div><button class="btn btn-primary" style="width:100%" type="submit">Sign In</button></form></main><script src="admin.js"></script><script>document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();const email=document.getElementById("email").value.trim();const password=document.getElementById("password").value;const ok=(email==="admin@greenhaven.local"&&password==="GreenHaven123");if(!ok){document.getElementById("error").textContent="Invalid admin credentials.";return}localStorage.setItem(GH_ADMIN_KEYS.auth,"true");location.href="index.html"});</script></body></html>
