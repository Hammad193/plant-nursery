<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Green Haven Orders</title><link rel="stylesheet" href="admin.css"></head><body data-auth-required="true"><aside class="sidebar"><div class="brand">Green Haven Nursery<small>Admin Panel</small></div><nav class="nav"><a href="index.html">Dashboard</a><a href="products.html">Products</a><a href="product-form.html">Add Product</a><a href="orders.html">Orders</a></nav><button class="btn btn-danger" style="margin:24px 12px 0" onclick="ghLogout()">Logout</button></aside><main class="main">
<div class="topbar"><h1>Orders</h1></div><div class="card"><div class="toolbar"><input class="input" id="search" placeholder="Search order, customer or phone..."><select class="select" id="filter" style="max-width:220px"><option value="all">All Statuses</option><option>New</option><option>Confirmed</option><option>Processing</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Total</th><th>Status</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script src="seed.js"></script><script src="admin.js"></script><script>
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const rows = document.getElementById("rows");

function render() {
    let orders = ghOrders().slice().reverse();
    const query = search.value.trim().toLowerCase();
    const selectedFilter = filter.value;

    orders = orders.filter(order => {
        const customer = order.customer || {};
        const haystack = [
            order.orderNumber,
            customer.name,
            customer.phone,
            customer.email,
            customer.city,
            customer.address
        ].join(" ").toLowerCase();

        return (!query || haystack.includes(query)) &&
            (selectedFilter === "all" || (order.status || "New") === selectedFilter);
    });

    rows.innerHTML = orders.map(order => `
        <tr>
            <td><strong>${ghEsc(order.orderNumber)}</strong></td>
            <td>${ghEsc(order.customer?.name)}</td>
            <td>${ghEsc(order.customer?.phone)}</td>
            <td>${ghMoney(order.total)}</td>
            <td><span class="badge status">${ghEsc(order.status || "New")}</span></td>
            <td>${new Date(order.createdAt).toLocaleString()}</td>
            <td><a class="btn btn-secondary" href="order-details.html?id=${encodeURIComponent(order.orderNumber)}">View</a></td>
        </tr>
    `).join("") || '<tr><td colspan="7" class="muted">No orders found.</td></tr>';
}

search.addEventListener("input", render);
filter.addEventListener("change", render);

document.addEventListener("DOMContentLoaded", async () => {
    if (await ghAdminReady()) {
        render();
    }
});

window.addEventListener("greenHavenOrdersUpdated", render);
window.addEventListener("storage", event => {
    if (event.key === GH_ADMIN_KEYS.orders) {
        render();
    }
});
</script></body></html>
